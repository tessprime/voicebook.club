[package]
name = "voicebook-backend"
version = "0.1.0"
edition = "2024"
# Matches the Dockerfile's toolchain. With edition 2024's resolver, Cargo (and so
# Dependabot's lockfile updates) prefers dependency versions that build on it.
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
bs58 = "0.5.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
hex = "0.4.3"
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "sha256", "std"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = "0.33.0"
opentelemetry-appender-tracing = "0.33.0"
opentelemetry-otlp = "0.33.0"
opentelemetry_sdk = "0.33.0"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "sha256", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"

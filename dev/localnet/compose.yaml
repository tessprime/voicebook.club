# Local ATmosphere for Voicebook development: PLC directory, PDS and Jetstream.
#
# Every service uses host networking so that "localhost" means the same thing
# to the containers, the backend and the browser. This matters because DID
# documents name the PDS as http://localhost:2583, and every consumer
# (Jetstream, the backend, the browser) has to be able to follow that URL.
#
# Secrets come from .env, generated by ./init.sh. State lives in named volumes;
# ./reset.sh deletes the volumes and .env together.
#
#   :2580  postgres   PLC's database
#   :2582  plc        did-method-plc, built from a pinned upstream commit
#   :2583  pds        official Bluesky PDS image
#   :6008  jetstream  official Jetstream image, reading the PDS firehose

name: voicebook-localnet

x-plc-env: &plc-env
  DB_CREDS_JSON: '{"username":"plc","password":"${POSTGRES_PASSWORD}","host":"127.0.0.1","port":"2580","database":"plc"}'
  DD_TRACE_ENABLED: "false"

services:
  postgres:
    image: postgres:18-alpine
    network_mode: host
    command: [postgres, -p, "2580", -c, listen_addresses=127.0.0.1]
    environment:
      POSTGRES_USER: plc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./init.sh first}
      POSTGRES_DB: plc
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -p, "2580", -U, plc, -d, plc]
      interval: 1s
      timeout: 3s
      retries: 30

  plc:
    build:
      # Upstream main as of 2026-09-28. Bump the commit to update.
      context: https://github.com/did-method-plc/did-method-plc.git#9c8ea2fe23b89a5c1011246cbb4957dad9dbf7db
      dockerfile: packages/server/Dockerfile
      # pnpm's parallel registry downloads time out on the default build
      # network under WSL.
      network: host
    image: voicebook-localnet/plc:9c8ea2f
    network_mode: host
    environment:
      <<: *plc-env
      PORT: "2582"
      ENABLE_MIGRATIONS: "true"
      DB_MIGRATE_CREDS_JSON: '{"username":"plc","password":"${POSTGRES_PASSWORD}","host":"127.0.0.1","port":"2580","database":"plc"}'
    depends_on:
      postgres:
        condition: service_healthy

  # Assigns sequence numbers to PLC operations; /export depends on it.
  plc-sequencer:
    image: voicebook-localnet/plc:9c8ea2f
    network_mode: host
    command: [node, --enable-source-maps, --import=./tracer.js, sequencer.js]
    environment:
      <<: *plc-env
    depends_on:
      plc:
        condition: service_started

  pds:
    image: ghcr.io/bluesky-social/pds:0.4
    network_mode: host
    environment:
      PDS_HOSTNAME: localhost # serves plain http on PDS_PORT, handles under .test
      PDS_PORT: "2583"
      PDS_DEV_MODE: "true"
      PDS_DID_PLC_URL: http://localhost:2582
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_JWT_SECRET: ${PDS_JWT_SECRET:?run ./init.sh first}
      PDS_DPOP_SECRET: ${PDS_DPOP_SECRET:?run ./init.sh first}
      PDS_ADMIN_PASSWORD: ${PDS_ADMIN_PASSWORD:?run ./init.sh first}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX:?run ./init.sh first}
      PDS_INVITE_REQUIRED: "false"
      PDS_CRAWLERS: ""
      LOG_ENABLED: "true"
      LOG_LEVEL: info
    volumes:
      - pds-data:/pds
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:2583/xrpc/_health]
      interval: 1s
      timeout: 3s
      retries: 30
    depends_on:
      plc:
        condition: service_started

  jetstream:
    image: ghcr.io/bluesky-social/jetstream:v0.3.6
    network_mode: host
    command: [serve]
    environment:
      JETSTREAM_RELAY_URL: http://localhost:2583
      JETSTREAM_PLC_URL: http://localhost:2582
      JETSTREAM_ADDR: 127.0.0.1:6008
      JETSTREAM_DATA_DIR: /home/nonroot/data
      JETSTREAM_LOG_FORMAT: text
      # Jetstream's first-start backfill walks the relay's listHosts, which a
      # PDS doesn't implement. Naming repos explicitly skips that walk. The
      # placeholder doesn't exist; accounts created afterwards arrive through
      # the live stream instead.
      JETSTREAM_BACKFILL_REPOS: did:plc:placeholderplaceholder00
    volumes:
      # Mounted at the image user's home so the new volume inherits its
      # ownership (the image runs as uid 65532).
      - jetstream-data:/home/nonroot
    depends_on:
      pds:
        condition: service_healthy

volumes:
  postgres-data:
  pds-data:
  jetstream-data:
